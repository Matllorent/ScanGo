# CI de ScanGo
# Corre la suite real (sin mocks) en Node 22 y 24 + auditoría de dependencias.
name: CI

# Se ejecuta en cada push y pull request.
on: [push, pull_request]

# Permiso mínimo para subir el reporte SARIF de OSV a la pestaña Security.
permissions:
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    # La suite completa (72 suites en secuencia) tarda varios minutos.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node-version: [22.x, 24.x]
    steps:
      # Descarga el código del repo.
      - uses: actions/checkout@v4

      # Instala Node según la matriz y cachea npm.
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # Instalación limpia y reproducible desde package-lock.json.
      - run: npm ci

      # Suite completa: flujos reales con el store local + guard que
      # restaura data/ al final (sin mocks de DB ni de pasarelas).
      - run: npm test

      # Análisis estático Semgrep (hace SKIP solo si semgrep no está instalado).
      - run: npm run test:semgrep

      # Auditoría de vulnerabilidades sobre el lockfile.
      # El action oficial `google/osv-scanner-action` quedó INUTILIZABLE:
      # v2.7.0 y v2.6.0 traen action.yml sin `runs:` (error upstream que
      # tumba el job en el setup, verificado 2026-10-15). Se usa el binario
      # directo con el MISMO patrón del job secret-scan (pin + sha256 del
      # release oficial). Informa sin bloquear (riesgo aceptado braces
      # documentado en AGENTS.md).
      - name: Auditoría OSV-Scanner (binario v2.6.0)
        env:
          OSV_VERSION: v2.6.0
          OSV_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/google/osv-scanner/releases/download/${OSV_VERSION}/osv-scanner_linux_amd64" -o osv-scanner
          echo "${OSV_SHA256}  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
          ./osv-scanner scan source -L package-lock.json --format sarif --output osv-results.sarif || true

      # Sube el SARIF si el escaneo lo generó (nunca rompe el build).
      - name: Subir SARIF de OSV
        if: always() && hashFiles('osv-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv-results.sarif

  # Escaneo de secretos con Gitleaks CLI (v8.30.1, pin exacto + verificación
  # SHA256). El action oficial de Gitleaks exige licencia comercial; el binario
  # CLI es MIT y gratis: lo instalamos y verificamos su hash en cada corrida.
  # Escanea TODO el historial del repo (fetch-depth: 0), no solo el HEAD.
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Gitleaks v8.30.1 (pin + sha256 del release oficial)
        env:
          GITLEAKS_VERSION: v8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION#v}_linux_x64.tar.gz" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version

      - name: Detectar secretos en todo el historial
        run: |
          set -euo pipefail
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1
