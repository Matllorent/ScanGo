# Backup diario de Supabase (plan free) — MITIGACIÓN DEL RIESGO #1
# ─────────────────────────────────────────────────────────────────────
# El plan free de Supabase NO tiene backups gestionados y pausa el proyecto
# tras ~1 semana de inactividad. Este workflow vuelca TODA la base con
# pg_dump (formato custom, portable, compressible) una vez por día a las
# 02:10 UTC, valida la integridad con pg_restore --list y sube el volcado
# como artifact con retención de 90 días. La conexión diaria además amortigua
# la pausa por inactividad (aunque NO es su garantía: el proyecto puede
# pausarse igual si nadie golpea las APIs; el backup es la red de seguridad).
#
# OPCIONAL: si los dueños configuran los secrets `BACKUP_REPO` +
# `BACKUP_REPO_TOKEN` (repo privado en GitHub para guardar dumps), el job
# pushea el volcado a ese repo como `latest.dump` (copia adicional fuera de
# los artifacts de GH, que expiran a los 90 días).
#
# Secrets requeridos:
#   SUPABASE_DB_URL   → cadena postgres del proyecto (ver README del runbook
#                       docs/produccion-checklist.md). Recomendado: la cadena del
#                       POOLER en modo SESIÓN (puerto 5432, usuario
#                       postgres.<ref>), porque la conexión directa es IPv6-only
#                       y los runners de GitHub no tienen ruta IPv6. Si el secret
#                       trae la conexión directa, el workflow la reescribe solo.
name: Backup Supabase (diario)

on:
  schedule:
    - cron: "10 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fecha del volcado (UTC)
        id: date
        run: echo "stamp=$(date -u +%Y-%m-%dT%H%MZ)" >> "$GITHUB_OUTPUT"

      - name: Volcado completo (pg_dump 17 vía Docker, custom format, sin owner/privileges)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          STAMP: ${{ steps.date.outputs.stamp }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::Falta el secret SUPABASE_DB_URL. Configuralo en Settings → Secrets and variables → Actions."
            exit 1
          fi

          # La conexión DIRECTA de Supabase es IPv6-only y los runners de GitHub
          # no tienen ruta IPv6 (error real: "Network is unreachable"). El pooler
          # es IPv4. pg_dump exige el modo SESIÓN (5432): el transaccional (6543)
          # no soporta las sentencias de nivel sesión que usa el volcado.
          DB_URL="$SUPABASE_DB_URL"
          if [[ "$DB_URL" == *"@db.olqdcudvstbawkcvsfdd.supabase.co"* ]]; then
            DB_URL="$(printf '%s' "$DB_URL" | sed -e 's#@db\.olqdcudvstbawkcvsfdd\.supabase\.co\(:5432\)\?/#@aws-0-us-east-1.pooler.supabase.com:5432/#' -e 's#//postgres:#//postgres.olqdcudvstbawkcvsfdd:#')"
            echo "::warning::SUPABASE_DB_URL usa la conexión directa (IPv6-only). Se usa el pooler IPv4 en modo sesión; actualizá el secret a la cadena del pooler cuando puedas."
          elif [[ "$DB_URL" == *"pooler.supabase.com:6543"* ]]; then
            DB_URL="${DB_URL/pooler.supabase.com:6543/pooler.supabase.com:5432}"
            echo "::warning::El pooler transaccional (6543) no soporta pg_dump; se usa el modo sesión (5432)."
          fi

          echo "Destino: $(printf '%s' "$DB_URL" | sed -E 's#^[a-z]+://[^@]+@##; s#/.*$##')"

          # La URL lleva el password: va por env-file (modo 600), nunca por argv.
          umask 077
          printf 'DB_URL=%s\n' "$DB_URL" > "$RUNNER_TEMP/db.env"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env-file "$RUNNER_TEMP/db.env" \
            --env PGSSLMODE=require \
            --volume "$PWD:/backup" \
            postgres:17 \
            sh -c 'pg_dump "$DB_URL" --format=custom --no-owner --no-privileges --file="/backup/scango-backup-'"${STAMP}"'.dump"'
          rm -f "$RUNNER_TEMP/db.env"

          test -s "scango-backup-${STAMP}.dump"
          echo "Volcado: $(du -h "scango-backup-${STAMP}.dump" | cut -f1)"

      - name: Validar integridad del volcado (pg_restore --list no debe fallar)
        env:
          STAMP: ${{ steps.date.outputs.stamp }}
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$PWD:/backup" \
            postgres:17 \
            pg_restore --list "/backup/scango-backup-${STAMP}.dump" > /dev/null
          echo "✔ Volcado íntegro"

      - name: Subir artifact del backup (retención 90 días)
        uses: actions/upload-artifact@v4
        with:
          name: scango-backup-${{ steps.date.outputs.stamp }}
          path: scango-backup-*.dump
          retention-days: 90
          if-no-files-found: error

      - name: Push a repo privado de backups (OPCIONAL)
        if: vars.BACKUP_REPO != ''
        env:
          BACKUP_REPO: ${{ vars.BACKUP_REPO }}
          BACKUP_REPO_TOKEN: ${{ secrets.BACKUP_REPO_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p backup-repo && cd backup-repo
          git init -q -b main
          git config user.name "scango-backup-bot"
          git config user.email "backups@menu-pizarron.com"
          cp "../scango-backup-${{ steps.date.outputs.stamp }}.dump" ./latest.dump
          git add latest.dump
          git -c commit.gpgsign=false commit -q -m "backup ${{ steps.date.outputs.stamp }}"
          git remote add origin "https://x-access-token:${BACKUP_REPO_TOKEN}@github.com/${BACKUP_REPO}.git"
          git push -q origin main