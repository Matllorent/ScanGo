<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restablecer Contraseña • ScanGo</title>
  <link rel="icon" type="image/png" href="/logo-scango.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0f0d;
      --card-bg: #141c18;
      --border: #23312a;
      --primary: #ecc94b;
      --primary-hover: #d4af37;
      --text: #f0fdf4;
      --text-dim: #94a3b8;
      --error: #ef4444;
      --success: #22c55e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 30px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .logo-container {
      text-align: center;
      margin-bottom: 24px;
    }
    .logo-container img {
      width: 45px;
      height: 44px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
    }
    p.sub {
      font-size: 13px;
      color: var(--text-dim);
      text-align: center;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #cbd5e1;
    }
    input {
      width: 100%;
      padding: 12px 14px;
      background: #0d1410;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus {
      border-color: var(--primary);
    }
    .btn {
      width: 100%;
      padding: 13px;
      background: var(--primary);
      color: #0b0f0d;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s, opacity 0.2s;
    }
    .btn:hover {
      background: var(--primary-hover);
    }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .alert {
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 18px;
      display: none;
      line-height: 1.4;
    }
    .alert-error {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--error);
      color: #f87171;
    }
    .alert-success {
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid var(--success);
      color: #4ade80;
    }
    .footer-link {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
    }
    .footer-link a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }
    .footer-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <img src="/logo-scango.png" alt="ScanGo" width="45" height="44" />
      <h1>Nueva Contraseña</h1>
      <p class="sub">Ingresá tu nueva clave para recuperar el acceso a tu cuenta.</p>
    </div>

    <div id="alertBox" class="alert"></div>

    <form id="resetForm">
      <div class="form-group">
        <label for="newPassword">Nueva Contraseña</label>
        <input type="password" id="newPassword" placeholder="Mínimo 6 caracteres" required minlength="6" autocomplete="new-password" />
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirmar Contraseña</label>
        <input type="password" id="confirmPassword" placeholder="Repetí tu nueva contraseña" required minlength="6" autocomplete="new-password" />
      </div>
      <button type="submit" id="btnSubmit" class="btn">Restablecer Contraseña</button>
    </form>

    <div class="footer-link">
      <a href="/">&larr; Volver al inicio de sesión</a>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');
    const alertBox = document.getElementById('alertBox');
    const resetForm = document.getElementById('resetForm');
    const btnSubmit = document.getElementById('btnSubmit');

    function showAlert(msg, isSuccess = false) {
      alertBox.textContent = msg;
      alertBox.className = isSuccess ? 'alert alert-success' : 'alert alert-error';
      alertBox.style.display = 'block';
    }

    if (!token) {
      showAlert('No se proporcionó ningún token de recuperación válido.');
      resetForm.style.display = 'none';
    } else {
      // Validate token on load
      fetch(`/api/auth/verify-reset-token?token=${encodeURIComponent(token)}`)
        .then(res => res.json())
        .then(data => {
          if (!data.success) {
            showAlert(data.message || 'El enlace de recuperación es inválido, ha expirado o ya fue utilizado.');
            resetForm.style.display = 'none';
          }
        })
        .catch(() => {
          // Network error or server offline
        });
    }

    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const p1 = document.getElementById('newPassword').value;
      const p2 = document.getElementById('confirmPassword').value;

      if (p1 !== p2) {
        showAlert('Las contraseñas no coinciden.');
        return;
      }
      if (p1.length < 6) {
        showAlert('La contraseña debe tener al menos 6 caracteres.');
        return;
      }

      btnSubmit.disabled = true;
      btnSubmit.textContent = 'Actualizando...';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, password: p1 })
        });
        const data = await res.json();
        if (data.success) {
          showAlert('¡Contraseña actualizada exitosamente! Redirigiendo...', true);
          resetForm.style.display = 'none';
          setTimeout(() => {
            window.location.href = '/?auth=login';
          }, 2000);
        } else {
          showAlert(data.message || data.error || 'No se pudo restablecer la contraseña.');
          btnSubmit.disabled = false;
          btnSubmit.textContent = 'Restablecer Contraseña';
        }
      } catch (err) {
        showAlert('Error de conexión al restablecer contraseña.');
        btnSubmit.disabled = false;
        btnSubmit.textContent = 'Restablecer Contraseña';
      }
    });
  </script>
</body>
</html>
