  /api/orders/coupon/validate:
    post:
      tags: [orders]
      summary: Validar un cupón antes de pedir (público)
      description: |-
        Resuelve el código contra las DOS fuentes: catálogo público del dueño
        (`customCoupons`) y el ledger PRIVADO de cupones de recupero
        (`VOL-XXXXXXXX`, que nunca viaja en el payload del menú). NO consume el
        código: la autoridad final (claim atómico) es `POST /api/orders`.
        Veredicto honesto en `data.reason`: `NOT_FOUND`, `EXPIRED`,
        `ALREADY_USED`, `NOT_FOR_THIS_PHONE`, `MALFORMED`, `NOT_APPLICABLE`
        (envío gratis fuera de delivery) o `UNAVAILABLE` (ledger ilegible).
        El teléfono solo se usa para verificar que el cupón sea del comensal
        (comparación por dígitos); no se persiste ni se devuelve.
      operationId: validateOrderCoupon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [restaurantId, code]
              properties:
                restaurantId:
                  type: string
                code:
                  type: string
                  minLength: 1
                  maxLength: 40
                phone:
                  type: string
                  maxLength: 30
                orderMode:
                  type: string
                  enum: [LOCAL, DELIVERY, TAKEAWAY]
                  default: LOCAL
      responses:
        '200':
          description: |-
            `{ valid, reason, message, source, coupon }`; `coupon` es
            `{ code, type, value, label }` o `null` (nunca el teléfono).
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
        '400':
          description: Body inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Restaurante no encontrado (`RESTAURANT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/orders:
    post:
      tags: [orders]
      summary: Crear pedido del comensal
      description: |-
        Valida con `createOrderSchema` (platos por `dishId` contra la carta real:
        inexistente → 400 `DISH_NOT_FOUND`). Reglas autoritativas: pedido mínimo
        del local → 400 `MIN_ORDER_NOT_MET`; `orderMode: DELIVERY` sin dirección
        → 400 `DELIVERY_ADDRESS_REQUIRED`. Carta vitrina (`allowMenuOrders=false`)
        → 403 `MENU_ORDERS_DISABLED`. Local cerrado → 400 `RESTAURANT_CLOSED`.
        Cupón de recupero: se resuelve contra el ledger privado y se reclama
        atómicamente antes de cobrar; un código existente pero no usable
        devuelve 422 `COUPON_EXPIRED` / `COUPON_NOT_FOR_THIS_PHONE` /
        `COUPON_MALFORMED` o 409 `COUPON_ALREADY_USED` (nunca cobra el total en
        silencio). Si el pedido no llega a crearse, el claim se libera.
        Responde 201 con el pedido + `trackingToken` (HMAC sin estado) y
        `tipAmount` (propina opcional, aparte del ticket promedio).
        Acredita fidelización en background sin romper el alta.
        **Comandero (Fase 2)**: con `Authorization: Bearer <token de turno>` del
        Sistema de Mozos, el mozo toma el pedido EN la mesa y el pedido sale con
        `source='staff'` + `waiterId`/`tableId` de la SESIÓN (jamás del body: el
        schema strippea las claves desconocidas → anti-forging). `waiter` sin
        mesa asignada → 403 `TABLE_NOT_ASSIGNED`; `kitchen` → 403
        `STAFF_ROLE_NOT_ALLOWED`; turno de otro local → 403
        `STAFF_RESTAURANT_MISMATCH`; Bearer inválido → 401 fail-closed.
        Sin Bearer (comensal) → `source='customer'` igual que siempre.
        Si el local lo exige, el comensal manda `captchaToken`; el staff lo salta.
      operationId: createOrder
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
          description: Clave de idempotencia (`api/middleware/idempotency.js`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Pedido creado con trackingToken
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Order'
        '400':
          description: Validación / plato inexistente / opciones inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Restaurante no encontrado (`RESTAURANT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |-
            Vitrina sin pedidos (`MENU_ORDERS_DISABLED`); comandero: rol
            `kitchen` (`STAFF_ROLE_NOT_ALLOWED`), mesa no asignada al mozo
            (`TABLE_NOT_ASSIGNED`) o turno de otro local
            (`STAFF_RESTAURANT_MISMATCH`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: |-
            Bearer de turno inválido/vencido (comandero fail-closed:
            `STAFF_CREDENTIAL_INVALID` / `SESSION_EXPIRED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Cupón de recupero ya usado (`COUPON_ALREADY_USED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |-
            Cupón de recupero vencido, de otro teléfono, malformado o de envío
            gratis fuera de delivery (`COUPON_EXPIRED`, `COUPON_NOT_FOR_THIS_PHONE`,
            `COUPON_MALFORMED`, `COUPON_NOT_APPLICABLE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
