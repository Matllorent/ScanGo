        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [pending, confirmed, preparing, ready, on_the_way, delayed, delivered, cancelled]
      responses:
        '200':
          description: Estado actualizado (`{ orderId, status, statusLabel, updatedAt, notification }`)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    required: [orderId, status, statusLabel]
                    properties:
                      orderId:
                        type: string
                      status:
                        type: string
                      statusLabel:
                        type: string
                      updatedAt:
                        type: string
                        format: date-time
        '400':
          description: Estado inválido (`INVALID_ORDER_STATUS`) o body/params malformados (`VALIDATION_ERROR`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Pedido de otro local (`ORDER_TENANT_MISMATCH`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Pedido no encontrado (`ORDER_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/loyalty/me:
    post:
      tags: [loyalty]
      summary: Tarjeta de fidelización del comensal
      description: |-
        Pública. Identidad por teléfono normalizado E.164. Cliente nuevo →
        200 `{ customer: null }`. Body inválido → 400 `VALIDATION_ERROR`.
      operationId: loyaltyCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  type: string
                  example: '+598 99 123 456'
                restaurantId:
                  type: string
      responses:
        '200':
          description: Tarjeta local + estado global de la red (o `{ customer: null }`)
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    nullable: true
        '400':
          description: Teléfono inválido (`VALIDATION_ERROR`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/loyalty/redeem:
    post:
      tags: [loyalty]
      summary: Canjear premio (emite código de un solo uso)
      description: |-
        Pública. Premios locales (por `restaurantId`) o globales (`rewardId: glob_*`).
        Emite código `LOY-XXXX-XXXX` que el dueño valida. Sin puntos → 400
        `INSUFFICIENT_LOCAL_POINTS` / `INSUFFICIENT_GLOBAL_POINTS`; premio
        inexistente → 404 `REWARD_NOT_FOUND`.
        Prueba de posesión: si el perfil tiene email registrado, el canje
        directo responde 403 `REDEEM_OTP_REQUIRED` (usar `/redeem/confirm`
        con el OTP) y sin email responde 422 `CUSTOMER_EMAIL_REQUIRED`
        (registrarlo en `/email` primero).
      operationId: loyaltyRedeem
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, rewardId]
              properties:
                phone:
                  type: string
                restaurantId:
                  type: string
                rewardId:
                  type: string
      responses:
        '200':
          description: Canje emitido (`{ code, rewardTitle, pointsCost, restaurantName }`)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/LoyaltyCode'
        '400':
          description: Validación / puntos insuficientes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Cliente / restaurante / premio no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Perfil con email → canje directo bloqueado (`REDEEM_OTP_REQUIRED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Perfil sin email → registrarlo primero (`CUSTOMER_EMAIL_REQUIRED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/loyalty/challenge:
    post:
      tags: [loyalty]
      summary: Enviar OTP al email del perfil
      description: |-
        Pública (rate-limit). `purpose` ∈ `redeem | erase | change-email`.
        202 + `{ maskedEmail }`; cliente inexistente → 404 `CUSTOMER_NOT_FOUND`;
        sin email → 422 `CUSTOMER_EMAIL_REQUIRED`. El código dura 10 minutos.
      operationId: loyaltyChallenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, purpose]
              properties:
                phone:
                  type: string
                purpose:
                  type: string
                  enum: [redeem, erase, change-email]
      responses:
        '202':
          description: Código enviado (`{ maskedEmail, expiresInMinutes }`)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
        '400':
          description: Validación (`VALIDATION_ERROR`, `INVALID_OTP_PURPOSE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Cliente no encontrado (`CUSTOMER_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Sin email registrado (`CUSTOMER_EMAIL_REQUIRED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/loyalty/redeem/confirm:
    post:
      tags: [loyalty]
      summary: Canjear premio con OTP verificado
      description: |-
        Misma emisión que `/redeem` pero con `otp` (propósito `redeem`) de un
        solo uso. OTP incorrecto/vencido/reutilizado → 403 `INVALID_OTP`.
      operationId: loyaltyRedeemConfirm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, rewardId, otp]
              properties:
                phone:
                  type: string
                restaurantId:
                  type: string
                rewardId:
                  type: string
                otp:
                  type: string
      responses:
        '200':
          description: Canje emitido (`{ code, rewardTitle, pointsCost, restaurantName }`)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/LoyaltyCode'
        '403':
          description: OTP inválido (`INVALID_OTP`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/loyalty/email:
    post:
      tags: [loyalty]
      summary: Registrar o cambiar el email del perfil
      description: |-
        First-write sin fricción; cambiar un email existente exige el OTP
        enviado al anterior (propósito `change-email`) → 403
        `EMAIL_CHANGE_OTP_REQUIRED` sin él.
      operationId: loyaltySetEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, email]
              properties:
                phone:
                  type: string
                email:
                  type: string
                otp:
                  type: string
      responses:
        '200':
          description: Email registrado (`{ maskedEmail }`)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
        '400':
          description: Email inválido (`INVALID_EMAIL`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Cambio sin OTP al anterior (`EMAIL_CHANGE_OTP_REQUIRED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/loyalty/winback:
    post:
      tags: [loyalty]
      summary: Campaña de recupero automatizada (dueño, F8)
      description: |-
        `authMiddleware` + `tenantGuard` + `requireActiveSubscription` + limiter.
        Detecta clientes en riesgo, filtra consentimiento de marketing + email,
        genera cupones `VOL-XXXXXXXX` de un solo uso atados al teléfono y envía
        email + push dirigido. Responde contadores (`sent`, `blockedConsent`,
        `blockedNoEmail`, `blockedOptOut`, `totalCandidates`) más `pushed` y
        `recipients[]` (aditivos): cada destinatario con `phoneMasked`,
        `couponCode`, `channels { email, push }` y un `waLink` operativo para
        reenviar a mano. El número completo vive SOLO dentro de `waLink`.
      operationId: loyaltyWinbackCampaign
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offerType]
              properties:
                offerType:
                  type: string
                  enum: [percent_10, percent_15, free_delivery]
                daysSinceLastVisit:
                  type: integer
                  minimum: 7
                  maximum: 365
                  default: 45
                minVisits:
                  type: integer
                  minimum: 1
                  default: 2
                customMessage:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Reporte de la campaña (`{ sent, pushed, recipients[], errors? }`)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
        '400':
          description: Body inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin local o suscripción inactiva
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/loyalty/winback/coupons:
    get:
      tags: [loyalty]
      summary: Ledger de cupones de recupero (dueño, F8-v2)
      description: |-
        `authMiddleware` + `tenantGuard` + `requireActiveSubscription`.
        Devuelve `{ summary, coupons[] }` con `code`, `label`, `type`, `value`,
        `createdAt`, `expiresAt`, `usedAt`, `status` (`live|used|expired`),
        `phoneMasked` y `usedOrderId`. NUNCA expone `boundPhone` ni
        `usedByPhone` crudos.
      operationId: loyaltyWinbackCoupons
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Cupones + resumen (`total`, `liveCount`, `usedCount`, `expiredCount`, `nextExpiry`)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
        '401':
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/loyalty/winback/telemetry:
    get:
      tags: [loyalty]
      summary: Telemetría del circuito de recupero (dueño, F8-v2)
      description: |-
        `authMiddleware` + `tenantGuard` + `requireActiveSubscription`.
        Cohorte por emisión en la ventana (`?days=` 1..365, default 30):
        `couponsIssued`, `couponsUsed`, `couponsLive`, `couponsExpired`,
        `recoveredCount`, `attributedRevenueCents` (solo pedidos REALES no
        cancelados encontrados por `usedOrderId`; si el pedido no está en el
        espejo no se inventa ingreso) y `conversionRate` (porcentaje con un
        decimal).
      operationId: loyaltyWinbackTelemetry
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
      responses:
        '200':
          description: Métricas del circuito
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
        '401':
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/loyalty/churn:
    get:
      tags: [loyalty]
      summary: Clientes en riesgo de no volver (dueño, R1)
      description: |-
        `authMiddleware` (401) + `tenantGuard` (403 sin local). Lista derivada
        de las cuentas REALES de fidelización del local: `visits >= minVisits`
        y ausencia >= `days` desde su última visita (7..365, default 45/2).
        Privacy-first: teléfono enmascarado y email solo como dominio.
      operationId: loyaltyChurnCandidates
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: days
          in: query
          schema: { type: integer, minimum: 7, maximum: 365, default: 45 }
        - name: minVisits
          in: query
          schema: { type: integer, minimum: 1, maximum: 10, default: 2 }
          description: Mínimo de visitas históricas del cliente (1 abre el segmento una-visita; se clampea a [1,10]).
      responses:
        '200':
          description: Reporte de recupero (`{ thresholdDays, minVisits, count, candidates[] }`)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
        '401':
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/loyalty/reactivation:
    post:
      tags: [loyalty]
      summary: Email de recupero a UN cliente (dueño, R1)
      description: |-
        `authMiddleware` (401) + `tenantGuard` + `requireActiveSubscription`.
        Cliente de otro local → 404 `CUSTOMER_NOT_FOUND`; el perfil sin email
        → 422 `NO_CUSTOMER_EMAIL`; sin consentimiento de marketing → 409
        `MARKETING_CONSENT_MISSING`; pidió baja de email → 409
        `CUSTOMER_OPTED_OUT`. Audit `REACTIVATION_SENT` con teléfono
        enmascarado.
      operationId: loyaltyReactivationSend
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customerId]
              properties:
                customerId:
                  type: string
                message:
                  type: string
                  maxLength: 400
                promoCode:
                  type: string
                  maxLength: 30
      responses:
        '200':
          description: Email enviado (`{ sent:true, emailMasked, provider }`)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
        '400':
          description: Body inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Cliente de otro local (`CUSTOMER_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Opt-out o consentimiento ausente (el email NO salió)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Perfil sin email (`NO_CUSTOMER_EMAIL`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/loyalty/validate:
    post:
      tags: [loyalty]
      summary: Validar código de canje (dueño)
      description: |-
        `authMiddleware` (401) + `tenantGuard` (IDOR por tenant). Código de otro
        local → 403 `CODE_OTHER_RESTAURANT`; ya canjeado → 409
        `CODE_ALREADY_REDEEMED`; vencido → 410 `CODE_EXPIRED`; inexistente → 404
        `CODE_NOT_FOUND`. (El param es `body.code`, no `:id`, para que el
        tenantGuard no lo confunda con tenant.)
      operationId: loyaltyValidate
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  example: LOY-AB12-CD34
      responses:
        '200':
          description: Código validado y marcado como canjeado
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
        '400':
          description: Código requerido (`CODE_REQUIRED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Código de otro restaurante (`CODE_OTHER_RESTAURANT`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Código no encontrado (`CODE_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Doble uso (`CODE_ALREADY_REDEEMED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: Código vencido (`CODE_EXPIRED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/orders/mercadopago/preference:
    post:
      tags: [orders]
      summary: Preferencia de pago online (Checkout Pro)
      description: |-
        Valida con `createOrderSchema`. Gate real: sin `restaurant.allowOnlinePayment`
        → 403 `ONLINE_PAYMENT_DISABLED` (default `false`). Carta vitrina
        (`allowMenuOrders=false`) → 403 `MENU_ORDERS_DISABLED`. Sin credenciales MP en
        el server → 500 `MP_NOT_CONFIGURED`. Restaurante inexistente → 404.
        Cobra el total COMPLETO: platos + envío (validado contra zonas,
        400 `INVALID_DELIVERY_FEE`) − cupón validado + propina; mínimo y
        dirección de delivery se exigen igual que en el pedido
        (400 `MIN_ORDER_NOT_MET` / `DELIVERY_ADDRESS_REQUIRED`).
        Un cupón de recupero se VALIDA acá sin reclamarse (pagar no es canjear:
        el claim atómico ocurre en `POST /api/orders`); si el código existe en
        el ledger pero no es usable, responde 409/422 con el mismo error
        honesto del pedido (nunca cobra el total en silencio).
      operationId: createMpPreference
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '200':
          description: Preferencia generada (`{ preferenceId, initPoint, externalReference, subtotal, deliveryFee, discount, tip, total }`)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    required: [preferenceId, initPoint]
                    properties:
                      preferenceId:
                        type: string
                      initPoint:
                        type: string
                        format: uri
                      sandboxInitPoint:
                        type: string
                      externalReference:
                        type: string
                      subtotal:
                        type: number
                      deliveryFee:
                        type: number
                      discount:
                        type: number
                      tip:
                        type: number
                      total:
                        type: number
        '400':
          description: Body inválido (`VALIDATION_ERROR`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Pago online deshabilitado (`ONLINE_PAYMENT_DISABLED`) o carta vitrina (`MENU_ORDERS_DISABLED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Restaurante no encontrado (`RESTAURANT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Cupón de recupero ya usado (`COUPON_ALREADY_USED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |-
            Cupón de recupero no aplicable al pedido (`COUPON_EXPIRED`,
            `COUPON_NOT_FOR_THIS_PHONE`, `COUPON_MALFORMED`,
            `COUPON_NOT_APPLICABLE`); no se reclama ni se cobra en silencio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/public/analytics/event:
    post:
      tags: [analytics]
      summary: Ingesta pública de evento de analítica
      description: |-
        Pública con rate-limit POR SLUG (un balde por restaurante). Eventos válidos:
        `visit|order|reservation|waiter|dish_click|order_placed`. Sin `slug`/`event`
        → 400; evento inválido → 400; slug inexistente → 404. Escribe telemetría
        (fuente única de verdad) y recalcula la proyección `restaurant.analytics`.
      operationId: trackPublicEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, event]
              properties:
                slug:
                  type: string
                event:
                  type: string
                  enum: [visit, order, reservation, waiter, dish_click, order_placed]
                dishId:
                  type: string
                branchId:
                  type: string
                amount:
                  type: number
                items:
                  type: array
                  items:
                    type: object
      responses:
        '200':
          description: Evento registrado (`{ success, analytics, telemetry }`)
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                    example: true
                  analytics:
                    type: object
                  telemetry:
                    type: boolean
                    example: true
        '400':
          description: slug/event requeridos o evento inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Restaurante no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/notifications/waiter-alert:
    post:
      tags: [notifications]
      summary: Aviso de mozo desde la mesa
      description: |-
        Pública (la llama el menú de la mesa), rate-limit por slug. Persiste el
        aviso en el inbox del dueño y dispara Web Push SOLO a suscripciones
        `role=owner`. Sin VAPID no rompe: 200 con `configured: false`. Slug
        inexistente → 404. Servicio configurable por el dueño: tipo `mozo` con
        `allowWaiterCall=false` → 403 `WAITER_CALL_DISABLED`; `cuenta_*` con
        `allowBillRequest=false` → 403 `BILL_REQUEST_DISABLED`.
      operationId: waiterAlert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug]
              properties:
                slug:
                  type: string
                table:
                  type: string
                  default: No especificada
                type:
                  type: string
                  enum: [mozo, cuenta_efectivo, cuenta_tarjeta]
                  default: mozo
      responses:
        '200':
          description: Aviso registrado (push entregado o degradado a WhatsApp/inbox)
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
        '400':
          description: Slug requerido (`VALIDATION_ERROR`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Restaurante no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Servicio deshabilitado por el dueño (`WAITER_CALL_DISABLED` / `BILL_REQUEST_DISABLED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/admin/overview:
    get:
      tags: [admin]
      summary: Métricas del panel maestro
      description: |-
        `adminMiddleware`: sin sesión admin (cookie `admin_token`, header
        `Authorization: Bearer`, o `x-admin-token` con JWT `role: admin_master`)
        → 403. Responde `{ metrics, restaurants, users }` con plata mensual,
        renovaciones a 7 días, pruebas por terminar y conversión de trial.
      operationId: adminOverview
      security:
        - adminCookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Métricas + restaurantes + usuarios
          content:
            application/json:
              schema:
                type: object
                required: [metrics, restaurants, users]
                properties:
                  metrics:
                    type: object
                  restaurants:
                    type: array
                    items:
                      $ref: '#/components/schemas/Restaurant'
                  users:
                    type: array
                    items:
                      type: object
        '403':
          description: Sin sesión administrativa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/billing/cancel:
    post:
      tags: [billing]
      summary: Baja voluntaria inmediata de la suscripción
      description: |-
        `authMiddleware` (401 sin sesión). Idempotente: si ya estaba
        `canceled` responde 200 igual. Pausa el menú al instante (luego el
        menú público responde 402). Sin cobro recurrente que cancelar en el
        server: el dueño también debe dar de baja su plan en la pasarela
        (Mercado Pago/Stripe) — la respuesta lo indica en `gatewayNote`.
        Derecho a dar de baja (Ley 17.250).
      operationId: billingCancel
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Suscripción dada de baja (o ya lo estaba) con `{ subscription, gatewayNote }`
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
        '401':
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Restaurante no encontrado
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error:
                    type: string
                  code:
                    type: string
  /api/storage/video-upload-url:
    post:
      tags: [storage]
      summary: URL firmada para subir un video de plato directo a Storage
      description: |-
        `authMiddleware` (401 sin sesión) + `storageLimiter`. Valida
        mime (video/mp4|webm) y tamaño (≤50 MB) y aplica el cupo de producto
        (`MAX_VIDEOS_PER_RESTAURANT` videos por carta, 403
        `VIDEO_LIMIT_EXCEEDED`). Los bytes nunca tocan el servidor: el
        navegador hace PUT al `uploadUrl` y guarda el `publicUrl` en
        `dish.videoUrl` (Stories lo reproduce con la foto de póster).
      operationId: storageVideoUploadUrl
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mimeType, sizeBytes]
              properties:
                fileName:
                  type: string
                mimeType:
                  type: string
                  enum: [video/mp4, video/webm]
                sizeBytes:
                  type: integer
      responses:
        '201':
          description: URL de subida generada (`{ uploadUrl, publicUrl, path, bucket, videosUsed, videosMax }`)
        '401':
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Cupo de videos por carta alcanzado (`VIDEO_LIMIT_EXCEEDED`)
        '404':
          description: Restaurante no encontrado
  /api/staff/shift/activate:
    post:
      tags: [staff]
      summary: Activar un turno escaneando el QR de equipo
      description: |-
        Público + `staffShiftLimiter`. Verifica la credencial del QR
        (`restaurantId`, `staffId`, `secret`) y emite un token opaco de sesión
        (32 chars, guardado hasheado, TTL 12 h deslizante con tope absoluto de
        24 h desde la activación). El secreto llega en el body —lo extrae el
        navegador del fragmento `#k=`— y nunca en query string ni logs.
        Credencial inválida o local ajeno → 401 `STAFF_CREDENTIAL_INVALID`
        (misma respuesta, sin enumerar el equipo); persona desactivada → 403
        `STAFF_INACTIVE`. Auditoría `STAFF_SHIFT_START`.
      operationId: staffShiftActivate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [restaurantId, staffId, secret]
              properties:
                restaurantId:
                  type: string
                  minLength: 1
                  maxLength: 100
                staffId:
                  type: string
                  minLength: 1
                  maxLength: 100
                secret:
                  type: string
                  minLength: 20
                  maxLength: 200
      responses:
        '200':
          description: Turno activado
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    required: [token, expiresAt, staff, restaurant, tables, pushConfigured]
                    properties:
                      token:
                        type: string
                        description: Token opaco de sesión (único y solo se devuelve acá)
                      expiresAt:
                        type: string
                        format: date-time
                      staff:
                        $ref: '#/components/schemas/StaffMember'
                      restaurant:
                        $ref: '#/components/schemas/StaffRestaurant'
                      tables:
                        type: array
                        items:
                          $ref: '#/components/schemas/StaffAssignment'
                      pushConfigured:
                        type: boolean
        '400':
          description: Body inválido (`VALIDATION_ERROR`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credencial inválida (`STAFF_CREDENTIAL_INVALID`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Persona desactivada (`STAFF_INACTIVE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Local inexistente (`RESTAURANT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit del turno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/staff/me:
    get:
      tags: [staff]
      summary: Identidad del turno, local y mesas asignadas
      description: |-
        Requiere el token opaco como `Authorization: Bearer <token>`; sin token
        401 `STAFF_TOKEN_REQUIRED`, token inválido/vencido/revocado 401
        `STAFF_SESSION_INVALID`. Es la llamada que hace la PWA `/mozo` al abrir
        y en cada refresco (polling 30 s) sin volver a pedir el QR.
      operationId: staffMe
      security:
        - staffBearerAuth: []
      responses:
        '200':
          description: Turno activo
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required: [staff, restaurant, session, tables, pushConfigured]
                    properties:
                      staff:
                        $ref: '#/components/schemas/StaffMember'
                      restaurant:
                        $ref: '#/components/schemas/StaffRestaurant'
                      session:
                        type: object
                        properties:
                          expiresAt:
                            type: string
                            format: date-time
                          lastSeenAt:
                            type: string
                            format: date-time
                      tables:
                        type: array
                        items:
                          $ref: '#/components/schemas/StaffAssignment'
                      pushConfigured:
                        type: boolean
        '401':
          description: Token faltante o inválido (`STAFF_TOKEN_REQUIRED` / `STAFF_SESSION_INVALID`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/staff/shift/heartbeat:
    post:
      tags: [staff]
      summary: Renovar el turno vivo
      description: |-
        Estira la sesión (TTL 12 h) sin pasar el tope absoluto de 24 h desde la
        activación y devuelve el vencimiento real. El middleware ya hace un
        touch throttled; este endpoint es explícito para que la PWA renueve al
        volver del background.
      operationId: staffShiftHeartbeat
      security:
        - staffBearerAuth: []
      responses:
        '200':
          description: Turno renovado
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required: [expiresAt]
                    properties:
                      expiresAt:
                        type: string
                        format: date-time
        '401':
          description: Token faltante o inválido (`STAFF_TOKEN_REQUIRED` / `STAFF_SESSION_INVALID`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/staff/shift/end:
    post:
      tags: [staff]
      summary: Cerrar el turno
      description: |-
        Idempotente: cierra la sesión y el token deja de servir al instante. La
        suscripción push queda guardada para el próximo turno de la misma
        persona. Auditoría `STAFF_SHIFT_END`.
      operationId: staffShiftEnd
      security:
        - staffBearerAuth: []
      responses:
        '200':
          description: Turno cerrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
        '401':
          description: Token faltante o inválido (`STAFF_TOKEN_REQUIRED` / `STAFF_SESSION_INVALID`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/staff/tables:
    get:
      tags: [staff]
      summary: Mesas asignadas a ESTA persona
      description: |-
        Solo las mesas cuyo `tableAssignments[mesa]` es esta persona. Sin
        asignaciones devuelve `tables: []` explícito (la PWA muestra que el
        dueño todavía no le asignó mesas, no una pizarra vacía silenciosa).
      operationId: staffTables
      security:
        - staffBearerAuth: []
      responses:
        '200':
          description: Mesas del turno
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required: [tables, restaurant, staff]
                    properties:
                      tables:
                        type: array
                        items:
                          $ref: '#/components/schemas/StaffAssignment'
                      restaurant:
                        $ref: '#/components/schemas/StaffRestaurant'
                      staff:
                        $ref: '#/components/schemas/StaffMember'
        '401':
          description: Token faltante o inválido (`STAFF_TOKEN_REQUIRED` / `STAFF_SESSION_INVALID`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/staff/push/subscribe:
    post:
      tags: [staff]
      summary: Activar los avisos push del turno
      description: |-
        Guarda la suscripción Web Push dirigida por `staff_id` (rol `waiter`),
        nunca por endpoint ni a todos los mozos: una tablet compartida puede
        cambiar de turno sin cruzar avisos. Best-effort: envía un push de
        bienvenida si VAPID está configurado; sin VAPID devuelve
        `pushConfigured: false` y `skipped: PUSH_NOT_CONFIGURED` sin romper.
      operationId: staffPushSubscribe
      security:
        - staffBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint, keys]
              properties:
                endpoint:
                  type: string
                  format: uri
                  maxLength: 2000
                keys:
                  type: object
                  required: [p256dh, auth]
                  properties:
                    p256dh:
                      type: string
                      maxLength: 1000
                    auth:
                      type: string
                      maxLength: 1000
      responses:
        '200':
          description: Suscripción guardada
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required: [subscriptionId, pushConfigured, delivered]
                    properties:
                      subscriptionId:
                        type: string
                      pushConfigured:
                        type: boolean
                      delivered:
                        type: integer
                        minimum: 0
                      skipped:
                        type: string
                        description: Motivo honesto del skip (p. ej. `PUSH_NOT_CONFIGURED`)
        '400':
          description: Endpoint o claves inválidas (`VALIDATION_ERROR`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token faltante o inválido (`STAFF_TOKEN_REQUIRED` / `STAFF_SESSION_INVALID`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [staff]
      summary: Desactivar los avisos push del turno
      description: |-
        Baja SOLO una suscripción propia del turno (no la de otro mozo ni la
        del dueño). Si el endpoint no pertenece a esta persona → 404
        `SUBSCRIPTION_NOT_FOUND`.
      operationId: staffPushUnsubscribe
      security:
        - staffBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [endpoint]
              properties:
                endpoint:
                  type: string
                  format: uri
                  maxLength: 2000
      responses:
        '200':
          description: Avisos del turno desactivados
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
        '400':
          description: Endpoint inválido (`VALIDATION_ERROR`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Token faltante o inválido (`STAFF_TOKEN_REQUIRED` / `STAFF_SESSION_INVALID`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: La suscripción no pertenece a este turno (`SUBSCRIPTION_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/reservations:
    post:
      tags: [reservations]
      summary: Alta pública de una reserva (comensal)
      description: |-
        Público + `reservationsPublicLimiter` (15 por local / 15 min). La
        reserva nace `requested` dentro del doc del local
        (`restaurant.reservations[]`, columna `profile` — cero migración) y el
        dueño la confirma desde el Studio. Capacidad server-side
        (`maxPerSlot`, `slotBufferMinutes`, `maxPax`, `maxAdvanceDays`): una
        franja llena o demasiado cerca → 409 `SLOT_UNAVAILABLE` (un solo
        código público, no se filtra el detalle de la agenda). CAPTCHA
        invisible como el pedido (403 `CAPTCHA_REQUIRED`/`CAPTCHA_INVALID`
        solo con `TURNSTILE_SECRET`). Demos → 200 `{demo:true}` no-op
        (nunca registran data). `allowReservations:false` del dueño → 403
        `RESERVATIONS_DISABLED`. Email al dueño best-effort (fire-and-forget:
        la reserva ya existe cuando llega el 201). Auditoría
        `RESERVATION_CREATED` con teléfono enmascarado.
      operationId: createReservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name, phone, date, time, pax]
              properties:
                slug:
                  type: string
                  minLength: 1
                  maxLength: 80
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                phone:
                  type: string
                  minLength: 8
                  maxLength: 24
                  description: Teléfono del comensal (solo dígitos tras normalizar; E.164 preferido)
                email:
                  type: string
                  format: email
                  maxLength: 120
                  description: Opcional — habilita el recordatorio de 24 h por email
                date:
                  type: string
                  format: date
                  pattern: '^\d{4}-\d{2}-\d{2}$'
                time:
                  type: string
                  pattern: '^\d{2}:\d{2}$'
                  example: '21:00'
                pax:
                  type: string
                  description: 'Cantidad de comensales (el select puede mandar `8+` para mesa larga)'
                  example: '4'
                notes:
                  type: string
                  maxLength: 300
                captchaToken:
                  type: string
                  description: Token de Turnstile (solo exigido con `TURNSTILE_SECRET`)
      responses:
        '201':
          description: Reserva registrada como `requested`
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    required: [reservation]
                    properties:
                      reservation:
                        $ref: '#/components/schemas/Reservation'
        '200':
          description: Demo — no-op honesto (`{demo:true}`, sin persistencia)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
                    required: [demo]
                    properties:
                      demo:
                        type: boolean
                        example: true
        '400':
          description: Datos inválidos (`VALIDATION_ERROR`, `RESERVATION_DATE_PAST`, `RESERVATION_PAX_INVALID`, `INVALID_RESERVATION_TIME`, ...)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Reservas apagadas por el dueño o CAPTCHA (`RESERVATIONS_DISABLED`, `CAPTCHA_REQUIRED`, `CAPTCHA_INVALID`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Local no encontrado (`RESTAURANT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Franja sin lugar (`SLOT_UNAVAILABLE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Límite por local alcanzado (15 / 15 min)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [reservations]
      summary: Agenda del dueño — reservas de UN día
      description: |-
        `authMiddleware` + `requireVerifiedEmail` (401 anónimo). Devuelve las
        reservas del día pedido (default: HOY en el huso del dueño vía
        `utcOffsetMinutes`), ordenadas por hora, con el anillo del Club
        (`club`: visitas del teléfono en ESTE local, lectura de fidelización
        que nunca crea cuenta), el `waLink` de WhatsApp prefilled (backlog #9:
        solo estados pre-visita con teléfono válido; terminales/sin teléfono →
        null) y `counts` del día + `pending` global (requested de cualquier
        fecha, para el badge del tab).
      operationId: listReservations
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: query
          name: date
          schema:
            type: string
            format: date
            pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Día de la agenda (YYYY-MM-DD); ausente → hoy local del dueño
      responses:
        '200':
          description: Agenda del día
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required: [date, allowReservations, reservations, counts]
                    properties:
                      date:
                        type: string
                        format: date
                      allowReservations:
                        type: boolean
                        description: Estado del toggle del dueño (aviso honesto cuando está apagado)
                      reservations:
                        type: array
                        items:
                          $ref: '#/components/schemas/Reservation'
                      counts:
                        type: object
                        required: [day, pending, requested, confirmed, seated, cancelled, noShow]
                        properties:
                          day:
                            type: integer
                            minimum: 0
                          pending:
                            type: integer
                            minimum: 0
                            description: requested vivas de TODAS las fechas (badge del tab)
                          requested:
                            type: integer
                            minimum: 0
                          confirmed:
                            type: integer
                            minimum: 0
                          seated:
                            type: integer
                            minimum: 0
                          cancelled:
                            type: integer
                            minimum: 0
                          noShow:
                            type: integer
                            minimum: 0
        '401':
          description: Sin sesión (`AUTH_REQUIRED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Dueño sin restaurante (`RESTAURANT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/reservations/{id}:
    patch:
      tags: [reservations]
      summary: Acción del dueño sobre una reserva
      description: |-
        `authMiddleware` + `requireActiveSubscription` (401 anónimo, 403 sin
        suscripción activa). Máquina de estados en el módulo puro
        (`api/utils/reservations.js`) re-validada DENTRO del mutex de
        escritura: `requested→confirmed|cancelled`,
        `confirmed→seated|no_show|cancelled`, terminales sin salida → 409
        `INVALID_RESERVATION_TRANSITION`. Una reserva de otro local es 404
        `RESERVATION_NOT_FOUND` (igual que orders). Cancelar puede enviar
        `cancelReason` (v1 UI manda el motivo fijo "Cancelada por el local").
        Auditoría `RESERVATION_STATUS_CHANGE` (de→a + motivo).
      operationId: updateReservationStatus
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID de la reserva (`resv_...`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [confirmed, seated, no_show, cancelled]
                  description: '`requested` no es un destino (nace en el alta) y los terminales no salen'
                cancelReason:
                  type: string
                  maxLength: 200
                  description: Motivo de la cancelación (solo `status=cancelled`)
      responses:
        '200':
          description: Transición aplicada
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    required: [reservation]
                    properties:
                      reservation:
                        $ref: '#/components/schemas/Reservation'
        '400':
          description: Estado inválido (`INVALID_RESERVATION_STATUS`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin sesión (`AUTH_REQUIRED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Sin suscripción activa (`SUBSCRIPTION_REQUIRED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Reserva ajena o inexistente (`RESERVATION_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Transición no permitida por la máquina (`INVALID_RESERVATION_TRANSITION`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/account/delete-request:
    post:
      tags: [account]
      summary: Derecho al olvido — borrado definitivo de la cuenta del dueño
      description: |-
        `authMiddleware` (401 sin sesión). Requiere `confirm: true` explícito
        (400 `CONFIRMATION_REQUIRED` si falta). Borra de verdad el usuario, su
        restaurante y los datos asociados (reseñas, feedback, pedidos, grupos de
        mesa, suscripciones push, telemetría, notificaciones) en local y en
        Supabase, además de las imágenes del bucket público
        (`tenants/<userId>/`). La sesión muere con la cuenta (401 al reintentar).
        Deja una entrada de auditoría `ACCOUNT_DELETE` ANTES del borrado.
        (Regulación br 2016/679 — RGPD; Ley 18.331 Uruguay; política de
        borrado de cuentas de Google Play.)
      operationId: accountDeleteRequest
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: boolean
                  description: Debe ser `true` para ejecutar el borrado
                reason:
                  type: string
                  maxLength: 500
                  description: Motivo opcional (opcional) que se registra en la auditoría
      responses:
        '200':
          description: Cuenta borrada (usuario, restaurante y datos asociados eliminados)
          content:
            application/json:
              schema:
                type: object
                required: [success, deleted]
                properties:
                  success:
                    type: boolean
                    example: true
                  deleted:
                    type: boolean
                    example: true
        '400':
          description: Falta la confirmación explícita (`confirm: true`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin sesión (o sesión ya revocada)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Cuenta no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit de eliminaciones (10/15 min)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth_token
      description: Sesión del dueño (JWT `7d`, también aceptado como `Authorization: Bearer`)
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Mismo JWT de `auth_token` por header `Authorization: Bearer <token>`
    staffBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: >-
        Token opaco de turno del equipo (mozos/cocina), emitido por
        `POST /api/staff/shift/activate` al escanear el QR. NO es el JWT del
        dueño: muere al cerrar el turno, vencer o rotar el QR.
    adminCookieAuth:
      type: apiKey
      in: cookie
      name: admin_token
      description: Sesión del panel maestro (JWT `role: admin_master` + 2FA TOTP al hacer login)
  schemas:
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 100
        password:
          type: string
          minLength: 6
          maxLength: 100
        name:
          type: string
          maxLength: 80
        restaurantName:
          type: string
          maxLength: 80
        bizName:
          type: string
          maxLength: 80
        businessType:
          type: string
          enum: [restaurant, heladeria, perfumery, events]
          default: restaurant
        # COPPA/RGPD: el registro lo hace un adulto responsable del negocio
        ageConfirmed:
          type: boolean
          enum: [true]
          description: Debe ser exactamente `true`; sin confirmación el registro responde 400
        # F4 · Atribución viral: slug de la carta que trajo al dueño (footer
        # "Esta carta corre con ScanGo" → `/?ref=<slug>`). Solo se persiste como
        # `acquiredVia` si apunta a una carta REAL existente (una demo o un slug
        # inexistente dejan el alta sin origen inventado).
        ref:
          type: string
          maxLength: 64
          pattern: '^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$'
          description: Slug de la carta referente (`?ref=` del footer viral)
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 100
        password:
          type: string
    AuthResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        user:
          type: object
          description: Usuario sin `password`
        restaurant:
          $ref: '#/components/schemas/Restaurant'
        requiresEmailVerification:
          type: boolean
          description: Solo en register con Supabase activo y casilla sin confirmar
        registered:
          type: boolean
          description: Solo en register duplicado (anti-enumeración, siempre 200)
    Restaurant:
      type: object
      required: [id, slug]
      properties:
        id:
          type: string
        userId:
          type: string
        acquiredVia:
          type: string
          maxLength: 64
          description: |-
            F4 · Atribución viral: slug de la carta que trajo a este dueño.
            Lo escribe SOLO el registro (`?ref=` validado contra una carta real);
            `stripPrivilegedFields` lo bloquea en `POST /api/studio/save`.
        slug:
          type: string
        name:
          type: string
        bizName:
          type: string
        phone:
          type: string
        currency:
          type: string
        city:
          type: string
        priceRange:
          type: string
          enum: ['$', '$$', '$$$', '$$$$']
          description: Visibilidad SEO local — allowlist estricta, emitida como priceRange en el JSON-LD de /m/:slug
        sameAs:
          type: array
          items:
            type: string
            format: uri
          description: URLs públicas únicas (https) — Google Business Profile, emitidas como sameAs en el JSON-LD
        latitude:
          type: number
          description: GeoCoordinates — rango [-90, 90], 6 decimales; null si no se configura
        longitude:
          type: number
          description: GeoCoordinates — rango [-180, 180], 6 decimales; null si no se configura
        businessType:
          type: string
          enum: [restaurant, heladeria, perfumery, events]
        theme:
          type: string
        layout:
          type: string
          enum: [classic, bento, minimalist, neon, billboard, ticker, sticker, delivery, stories, brutalist]
        imageMode:
          type: string
          enum: [auto, grid, none, hero]
          description: |-
            Motor de plantillas — modo de imagen elegido por el dueño ('auto' = default de la
            morfología). En GET /api/menu se emite ya RESUELTO contra las capacidades del layout
            (grid | none | hero; ver api/utils/themeManifest.js). Aditivo: no cambia el resto.
        menuSizing:
          type: string
          enum: [uniform, popularity]
          description: |-
            Motor de plantillas — tamaño de las cartas. En GET /api/menu se emite resuelto
            ('popularity' solo si la morfología lo soporta; si no, 'uniform'). Cuando es
            'popularity', cada plato de `dishes` suma `popTier` (2 grande / 1 normal / 0 chico):
            derivado acotado de la popularidad real, nunca scores crudas ni conteos.
        allowOnlinePayment:
          type: boolean
          description: Interruptor del dueño para el pago online (default false)
        onlinePaymentReady:
          type: boolean
          description: Solo en GET /api/menu — hay con qué cobrar (solo lectura)
        scheduleEnabled:
          type: boolean
          description: Horario de atención activo del dueño (la franja vive en scheduleActiveHours)
        scheduleActiveHours:
          type: string
          description: |-
            Franja de atención HH:MM-HH:MM. Un rango invertido (inicio > fin, p.ej. 18:00-02:00)
            es una ventana nocturna que cruza medianoche. Bordes inclusivos.
        showClosingCountdown:
          type: boolean
          description: |-
            Interruptor del dueño para el contador de cierre en el badge del menú (default true).
            Cuando el local está abierto por horario y faltan menos de 60 minutos, el badge
            muestra "Abierto · Cierra en N min" en vez de la franja horaria.
        showTrendingChip:
          type: boolean
          description: |-
            Interruptor del dueño para el chip "🔥 Muy pedido esta semana" del menú (default true).
            Apagado, el servidor no consulta ventas ni emite `trendingLabel` (cero costo).
        showPrepEstimate:
          type: boolean
          description: |-
            Interruptor del dueño para el tiempo estimado de preparación (default true). Mide
            `created_at → status_updated_at` de los pedidos ENTREGADOS de los últimos 7 días;
            apagado, el servidor no consulta pedidos ni emite `prepEstimate` (cero costo).
        prepEstimate:
          type: object
          nullable: true
          description: |-
            Solo en GET /api/menu. Estimación honesta del local: `null` si el dueño la apagó,
            si no hay 20 pedidos entregados en 7 días o si la consulta falló. Nunca expone
            pedidos ni PII.
          properties:
            samples:
              type: integer
              description: Cantidad de pedidos entregados usados como evidencia
            p50:
              type: integer
            p90:
              type: integer
            min:
              type: integer
            max:
              type: integer
            label:
              type: string
              example: ~12–18 min
            windowDays:
              type: integer
              example: 7
            generatedAt:
              type: string
              format: date-time
        allowIceCreamWizard:
          type: boolean
        categories:
          type: array
          items:
            type: object
        dishes:
          type: array
          items:
            type: object
            description: |-
              Plato de la carta. Aditivos del motor de plantillas: `popTier` (2|1|0) solo cuando
              `menuSizing` es 'popularity' (tamaño visual por popularidad; ver popularityTiers.js).
        branches:
          type: array
          items:
            type: object
        subscription:
          $ref: '#/components/schemas/Subscription'
    Subscription:
      type: object
      properties:
        status:
          type: string
          enum: [trialing, active, past_due, expired, canceled, paused]
        plan:
          type: string
          enum: [starter_monthly, starter_annual, event_once, free]
        provider:
          type: string
          example: trial
        trialEndsAt:
          type: string
          format: date-time
        currentPeriodEnd:
          type: string
          format: date-time
        gracePeriodDaysRemaining:
          type: integer
    CreateOrderRequest:
      type: object
      required: [restaurantId, items]
      properties:
        restaurantId:
          type: string
        tableNumber:
          oneOf:
            - type: string
            - type: number
          default: '1'
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [dishId, quantity]
            properties:
              dishId:
                type: string
              quantity:
                type: integer
                minimum: 1
              note:
                type: string
                maxLength: 250
              orderedBy:
                type: string
              orderedById:
                type: string
              choices:
                type: array
                items:
                  type: object
              customIceCream:
                type: object
                description: Helado a medida (armador). El servidor recomputa el total contra la config del dueño; el precio del cliente se ignora
                properties:
                  containerId:
                    type: string
                  flavorIds:
                    type: array
                    items:
                      type: string
                  toppingIds:
                    type: array
                    items:
                      type: string
              options:
                type: object
        currency:
          type: string
          maxLength: 5
        customerName:
          type: string
          maxLength: 100
        customerPhone:
          type: string
          maxLength: 30
        deliveryAddress:
          type: string
          maxLength: 200
        notes:
          type: string
          maxLength: 300
        isGroupOrder:
          type: boolean
        participants:
          type: array
          items:
            type: string
        groupSessionId:
          type: string
        tipAmount:
          type: number
          minimum: 0
          maximum: 1000000
          default: 0
          description: Propina opcional del comensal, aparte del monto de los platos
    Order:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        restaurantId:
          type: string
        tableNumber:
          type: string
        status:
          type: string
          enum: [pending, confirmed, preparing, ready, on_the_way, delayed, delivered, cancelled]
        currency:
          type: string
        amount:
          type: number
        total:
          type: number
        tipAmount:
          type: number
          description: Propina declarada, persistida aparte del ticket
        source:
          type: string
          enum: [customer, staff, kiosk]
          description: |-
            Canal de origen. Lo decide SIEMPRE el server: `customer` (comensal
            del menú) o `staff` (comandero del mozo con Bearer de turno válido).
            El client no puede forjarlo (el schema lo strippea del body).
        waiterId:
          type: string
          nullable: true
          description: Solo `source=staff` — id del mozo de la sesión de turno
        tableId:
          type: string
          nullable: true
          description: Solo `source=staff` — id del mozo asignado a la mesa
        waiterName:
          type: string
          nullable: true
          description: Nombre del mozo resuelto server-side en los listados del dueño (KDS/Studio); nunca viaja del client
        trackingToken:
          type: string
          description: Token HMAC sin estado `${orderId}.${firma}` para el seguimiento público
        itemsSnapshot:
          type: array
          items:
            type: object
        created_at:
          type: string
          format: date-time
    OrderTracking:
      type: object
      required: [orderId, status, statusLabel]
      properties:
        orderId:
          type: string
        status:
          type: string
          enum: [pending, confirmed, preparing, ready, on_the_way, delayed, delivered, cancelled]
        statusLabel:
          type: string
          example: Recibido
        restaurantName:
          type: string
        tableNumber:
          type: string
        currency:
          type: string
        total:
          type: number
        tip:
          type: number
        prepEstimate:
          type: object
          nullable: true
          description: |-
            Cuánto tardan los pedidos de ESTE local (null si el dueño lo apagó, si la muestra
            no alcanza o si la consulta falló). Número del local, sin PII.
          properties:
            samples:
              type: integer
            p50:
              type: integer
            p90:
              type: integer
            label:
              type: string
              example: ~12–18 min
        items:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              quantity:
                type: integer
        updatedAt:
          type: string
          format: date-time
    LoyaltyCode:
      type: object
      required: [code]
      properties:
        code:
          type: string
          pattern: '^LOY-[A-Z0-9]{4}-[A-Z0-9]{4}$'
          example: LOY-AB12-CD34
        rewardTitle:
          type: string
        pointsCost:
          type: integer
        restaurantName:
          type: string
    Error:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: Restaurante no encontrado para el pedido
        code:
          type: string
          example: RESTAURANT_NOT_FOUND
        details:
          description: Detalle de validación (formato Zod) u otro contexto
    Dish:
      type: object
      required: [id, categoryId, name, price]
      properties:
        id:
          type: string
        categoryId:
          type: string
        name:
          type: string
          maxLength: 100
        price:
          type: number
          minimum: 0
        originalPrice:
          type: number
          minimum: 0
          nullable: true
        description:
          type: string
          maxLength: 500
        photoUrl:
          type: string
          format: uri
          maxLength: 2048
        videoUrl:
          type: string
          format: uri
          maxLength: 500
        outOfStock:
          type: boolean
        dailyStock:
          type: integer
          minimum: 1
          maximum: 9999
          description: >-
            Stock diario del plato (opt-in, F3 "Agotados con memoria"):
            "vendo ~N por día". Ausente = sin memoria (comportamiento normal).
        station:
          type: string
          maxLength: 16
          description: >-
            Estación de cocina del plato (F6, texto libre del dueño: "Barra",
            "Cocina", "Parrilla"…). Ausente = se ve en todas las estaciones del
            KDS. Dato OPERATIVO del local: NO viaja en el payload público del
            menú (la pizarra la resuelve desde la sesión autenticada).
        isChefSpecial:
          type: boolean
        iceCreamSurcharge:
          type: number
          minimum: 0
          maximum: 1000000
        weatherTags:
          type: array
          items:
            type: string
        schedule:
          type: object
          nullable: true
        modifierGroupIds:
          type: array
          items:
            type: string
        variants:
          type: array
          items:
            type: object
        proteinOptions:
          type: array
          items:
            type: object
        variantSelectionMode:
          type: string
        variantsRequired:
          type: boolean
        kid_friendly:
          type: boolean
        allergens:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
    MenuDish:
      type: object
      required: [id, categoryId, name, price]
      properties:
        id:
          type: string
        categoryId:
          type: string
        name:
          type: string
        price:
          type: number
        originalPrice:
          type: number
          nullable: true
        description:
          type: string
        photoUrl:
          type: string
          format: uri
        videoUrl:
          type: string
          format: uri
        outOfStock:
          type: boolean
        dailyStock:
          type: integer
          minimum: 1
          maximum: 9999
          description: Tope de ventas diarias configurado por el dueño (opt-in; ausente = sin tope).
        soldOutToday:
          type: boolean
          description: >-
            Derivado server-side: true cuando las ventas de HOY (día local del
            dueño, mismo huso que El Cierre) alcanzan `dailyStock`. El flag
            manual `outOfStock` gana siempre; el derivado revive solo a la
            medianoche local, sin cron de reset.
        trendingLabel:
          type: string
          maxLength: 40
          description: >-
            Chip de tendencia HONESTA (F5): "🔥 Muy pedido esta semana", emitido
            solo cuando el plato acumuló unidades vendidas reales en la ventana
            de 7 días (mínimo 3, tope 3 platos, cancelados fuera). Ausente = el
            plato no tiene evidencia suficiente o el dueño apagó el chip
            (`showTrendingChip: false`). El payload público NUNCA expone
            unidades, scores ni conteos.
        isChefSpecial:
          type: boolean
        iceCreamSurcharge:
          type: number
        weatherTags:
          type: array
          items:
            type: string
        schedule:
          type: object
          nullable: true
        modifierGroupIds:
          type: array
          items:
            type: string
        variants:
          type: array
          items:
            type: object
        popTier:
          type: integer
          minimum: 0
          maximum: 2
          description: Tier de popularidad (2 grande / 1 normal / 0 chico) — solo con menuSizing=popularity
    StaffMember:
      type: object
      required: [id, name, role, roleLabel, active]
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 80
        role:
          type: string
          enum: [waiter, kitchen]
        roleLabel:
          type: string
          example: Mozo
        active:
          type: boolean
        credentialUpdatedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        activeSessions:
          type: integer
          minimum: 0
          description: Sesiones de turno vivas (solo en el panel del dueño)
        tables:
          type: array
          items:
            $ref: '#/components/schemas/StaffAssignment'
    StaffRestaurant:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
    StaffAssignment:
      type: object
      required: [number, label]
      properties:
        number:
          type: string
          example: '4'
        label:
          type: string
          example: Mesa 4
    StaffTableAssignment:
      type: object
      required: [number, label, staffId, staffName]
      properties:
        number:
          type: string
          example: '4'
        label:
          type: string
          example: Mesa 4
        staffId:
          type: string
        staffName:
          type: string
    Reservation:
      type: object
      required: [id, name, phone, date, time, pax, status, statusLabel]
      properties:
        id:
          type: string
          example: resv_1730000000000_ab12cd
        name:
          type: string
          maxLength: 80
        phone:
          type: string
          description: Teléfono del comensal (E.164 normalizado; para el dueño que opera la reserva)
        email:
          type: string
          format: email
          description: Opcional — destinatario del recordatorio de 24 h
        date:
          type: string
          format: date
        time:
          type: string
          pattern: '^\d{2}:\d{2}$'
          example: '21:00'
        pax:
          type: integer
          minimum: 1
          maximum: 99
        paxLabel:
          type: string
          example: '8+'
          description: Presentación de pax para mesa larga (cuando corresponde)
        notes:
          type: string
          maxLength: 300
        status:
          type: string
          enum: [requested, confirmed, seated, cancelled, no_show]
        statusLabel:
          type: string
          example: Solicitada
        cancelReason:
          type: string
          maxLength: 200
        source:
          type: string
          enum: [menu]
          description: Origen del alta (v1: solo el chip del menú)
        createdAt:
          type: string
          format: date-time
        statusUpdatedAt:
          type: string
          format: date-time
        club:
          $ref: '#/components/schemas/ReservationClub'
        waLink:
          type: string
          nullable: true
          description: |-
            Link `https://wa.me/<dígitos>?text=...` con el recordatorio prefilled
            (backlog #9, oct-2026) — SOLO en la agenda del dueño (GET; el alta y
            el PATCH no lo llevan). Copys por estado: `requested` → confirma,
            `confirmed` → recorda. Terminales y filas sin teléfono válido → null
            (nunca se enumera). El número completo vive únicamente dentro del link.
    ReservationClub:
      type: object
      description: Anillo del Club para ese teléfono (solo en la agenda del dueño; lectura, nunca crea cuenta)
      required: [localVisits, globalVisits]
      properties:
        level:
          type: string
          description: Etiqueta del nivel de red (vacío si no tiene)
        localVisits:
          type: integer
          minimum: 0
        globalVisits:
          type: integer
          minimum: 0
