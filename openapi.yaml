openapi: 3.1.0
info:
  title: ScanGo
  version: 2.0.0
  description: |-
    Contrato HTTP real del backend (Express 5, entrypoint `api/index.js`).
    Solo documenta endpoints verificados en el código: cada path/método/código
    de acá existe en su router o en `api/index.js`. El sobre de éxito es el de
    `api/utils/response.js` (`successResponse`: `{ success: true, message?, data? }`)
    y el de error (`errorResponse` / `AppError`: `{ success: false, error, code?, details? }`).
servers:
  - url: http://localhost:3000
    description: Desarrollo local (`npm run dev`)
  - url: https://scango.app
    description: Producción (Vercel)
security: []
tags:
  - name: auth
    description: Registro, login y sesión (`api/routes/auth.js`)
  - name: menu
    description: Menú público (`GET /api/menu/:slug` en `api/index.js`)
  - name: studio
    description: Panel del dueño (`api/routes/studio.js`)
  - name: orders
    description: Pedidos del comensal + seguimiento + pago online (`api/routes/orders.js`)
  - name: loyalty
    description: Fidelización dual local + red global (`api/routes/loyalty.js`)
  - name: notifications
    description: Push Web y avisos de mesa (`api/routes/notifications.js`)
  - name: staff
    description: Turno del equipo operativo — mozos y cocina (`api/routes/staff.js`)
  - name: reservations
    description: Reservas de verdad — alta del comensal y agenda del dueño (`api/routes/reservations.js`)
  - name: analytics
    description: Canal público de analítica (`POST /api/public/analytics/event` en `api/index.js`)
  - name: admin
    description: Panel maestro (`GET /api/admin/overview` en `api/index.js`)
  - name: billing
    description: Suscripción y baja voluntaria (`POST /api/billing/*` en `api/index.js`)
  - name: account
    description: Ciclo de vida de la cuenta del dueño (derecho al olvido, RGPD / Ley 18.331)
paths:
  /api/auth/register:
    post:
      tags: [auth]
      summary: Registrar dueño + restaurante
      description: |-
        Valida con `registerSchema` (`api/middleware/validation.js`), rechaza
        dominios descartables (`DISPOSABLE_EMAIL_REJECTED`). Anti-enumeración:
        con email ya registrado responde 200 genérico (sin crear nada, sin
        JWT, con `requiresEmailVerification: true`) y avisa al titular por
        email. Sesión 100% por cookie `auth_token` (httpOnly): el JWT NO viaja
        en el body. Responde 200 (no 201) con `user`, `restaurant` en plano
        (`flatData: true`).
      operationId: authRegister
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Registro exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validación / email descartable / email ya registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/login:
    post:
      tags: [auth]
      summary: Iniciar sesión
      description: |-
        Valida con `loginSchema`. Credenciales mal → 401 `INVALID_CREDENTIALS`.
        Sesión 100% por cookie `auth_token` (httpOnly): el JWT NO viaja en el
        body. Devuelve `user` y `restaurant` en plano. App nativa: usar
        `POST /api/auth/device` (credencial opaca revocable).
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Body inválido (`VALIDATION_ERROR`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Credenciales incorrectas (`INVALID_CREDENTIALS`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/device:
    post:
      tags: [auth]
      summary: Emitir credencial opaca para app nativa
      description: |-
        El WebView de Capacitor corre en otro origen y las cookies
        `SameSite=Lax` no viajan: la app se autentica con esta credencial
        opaca (Bearer) en vez del JWT. Verifica email+password (con migración
        legacy), rate-limit de auth. El crudo se devuelve UNA vez (solo su
        hash se almacena); re-login del mismo `deviceName` rota. Expira al
        año; el reset la revoca. Sin JWT en la respuesta.
      operationId: authDeviceIssue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
                deviceName:
                  type: string
      responses:
        '201':
          description: Credencial emitida (`{ deviceToken, device }`)
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
        '401':
          description: Credenciales incorrectas (`INVALID_CREDENTIALS`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/auth/devices:
    get:
      tags: [auth]
      summary: Listar dispositivos vinculados (sesión)
      description: Sin hashes, solo metadata.
      operationId: authDevicesList
      responses:
        '200':
          description: Lista de dispositivos
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  data:
                    type: object
  /api/auth/devices/{id}:
    delete:
      tags: [auth]
      summary: Revocar un dispositivo (sesión)
      description: |-
        Revoca la credencial indicada del propio usuario.
      operationId: authDeviceRevoke
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Dispositivo desvinculado
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
        '404':
          description: Dispositivo no encontrado (`DEVICE_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/demos:
    get:
      tags: [menu]
      summary: Lista de demos públicas por rubro
      description: |-
        Metadatos de las 4 demos navegables (in-memory, sin persistencia):
        restaurant, heladeria, perfumery, events. Sin auth.
      operationId: listDemos
      responses:
        '200':
          description: Lista de demos
          content:
            application/json:
              schema:
                type: object
                properties:
                  demos:
                    type: array
                    items:
                      type: object
  /api/demos/{type}:
    get:
      tags: [menu]
      summary: Plantilla demo completa por rubro
      description: |-
        Devuelve la demo como objeto restaurante editable (lo que el Studio en
        modo `?demo=` carga en el editor). Tipos: `restaurant`, `heladeria`,
        `perfumery`, `events`. Tipo inválido → 404. Sin auth.
      operationId: getDemo
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
          example: heladeria
      responses:
        '200':
          description: Demo completa
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Demo no encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/discover/feed:
    get:
      tags: [menu]
      summary: Feed público beta de platos (formato tiktok de la zona)
      description: |-
        Solo locales con `allowDiscovery=true` y suscripción válida, con
        platos disponibles (máx 6 por local, round-robin). Sin PII: nunca
        teléfono, dirección, userId ni emails. `likeCount` 90d por plato.
        Rate-limit público + cache 60s. Sin auth.
      operationId: getDiscoverFeed
      parameters:
        - name: city
          in: query
          required: false
          schema:
            type: string
          example: Montevideo
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 12
        - name: offset
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum: [mix, top]
            default: mix
          description: mix (round-robin justo) o top (tendencias por likes, orden global antes de paginar).
      responses:
        '200':
          description: Página del feed beta
          content:
            application/json:
              schema:
                type: object
  /api/menu/{slug}:
    get:
      tags: [menu]
      summary: Menú público por slug
      description: |-
        Respuesta directa SIN sobre `success/data` (`res.json(data)`): `{ restaurant, weatherContext, ... }`.
        Expone `allowOnlinePayment` (boolean, interruptor del dueño) y `onlinePaymentReady`.
        Slugs demo (`demo-restaurante`, `demo-heladeria`, `demo-perfumeria`, `demo-evento`)
        sirven el catálogo in-memory con `isDemo: true`, siempre online (sin `verifyAccess`).
        Slug inexistente → 404 `{ error: 'Restaurante no encontrado' }` (sin `success`/`code`).
        Menú pausado por suscripción → 402 `MenuTemporalmenteInactivo`.
      operationId: getPublicMenu
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
          example: mi-local
      responses:
        '200':
          description: Menú público
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicMenu'
        '402':
          description: Menú pausado por suscripción
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Restaurante no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/studio/save:
    post:
      tags: [studio]
      summary: Guardar restaurante / menú completo
      description: |-
        Cadena real: `authMiddleware` (401 sin sesión) → `requireVerifiedEmail`
        (403 `EMAIL_NOT_CONFIRMED`) → `requireActiveSubscription` (402
        `SUBSCRIPTION_REQUIRED`, 404 `RESTAURANT_NOT_FOUND`). Acepta el payload
        en `body.data` o en la raíz. Responde `{ success: true, restaurant }`.
      operationId: studioSave
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Payload sanitizado por `sanitizeRestaurantPayload` (máx 1MB)
      responses:
        '200':
          description: Restaurante guardado
          content:
            application/json:
              schema:
                type: object
                required: [success, restaurant]
                properties:
                  success:
                    type: boolean
                    example: true
                  restaurant:
                    $ref: '#/components/schemas/Restaurant'
        '401':
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: Suscripción inactiva (`SUBSCRIPTION_REQUIRED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Email sin confirmar (`EMAIL_NOT_CONFIRMED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Restaurante no encontrado (`RESTAURANT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: |-
            Concurrencia optimista: el `updatedAt` del cliente es MÁS VIEJO que la
            versión vigente del server (otra pestaña/empleado guardó desde su última
            lectura). El Studio ofrece sobrescribir reintentando con `currentUpdatedAt`.
            Sin `updatedAt` en el payload (cliente legacy) nunca conflictúa.
          content:
            application/json:
              schema:
                type: object
                required: [success, error, code, currentUpdatedAt]
                properties:
                  success:
                    type: boolean
                    example: false
                  error:
                    type: string
                    example: El menú fue actualizado en otra pestaña o por otro empleado.
                  code:
                    type: string
                    example: MENU_CONCURRENCY_CONFLICT
                  currentUpdatedAt:
                    type: string
                    format: date-time
                    example: '2026-10-12T18:00:00.000Z'
  /api/studio/branches:
    patch:
      tags: [studio]
      summary: Operación granular de sucursal (add/update/delete)
      description: |-
        `authMiddleware` (401) + `requireVerifiedEmail` + `requireActiveSubscription`.
        Body `{ operation, branch?, branchId?, branchSlug? }`. Idempotente por
        header `X-Idempotency-Key`: el marcador persiste en memoria (L1) y en la
        tabla `webhooks` (`provider: studio_branches`, local + cloud) con la
        respuesta guardada — un retry post-restart devuelve lo mismo sin re-ejecutar.
      operationId: studioBranchOp
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: X-Idempotency-Key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [operation]
              properties:
                operation:
                  type: string
                  enum: [add, update, delete]
      responses:
        '200':
          description: Operación aplicada (o replay idempotente)
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Operación inválida (`VALIDATION_ERROR` de forma o error de `updateBranches`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Restaurante no encontrado (`RESTAURANT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/studio/events:
    post:
      tags: [studio]
      summary: Crear evento (restaurante temporal con expiración)
      description: |-
        `authMiddleware` (401) + `requireVerifiedEmail` + `requireActiveSubscription`.
        Body validado con zod (`name`, `eventDate` ISO; fecha inválida → 400
        `INVALID_EVENT_DATE`). El evento nace en trial hasta `eventDate`/`expiresAt`
        con plan `event_once` (pago único, sin renovación).
      operationId: studioCreateEvent
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, eventDate]
              properties:
                name:
                  type: string
                eventDate:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Evento creado (`{ success, event, eventQRUrl }`)
          content:
            application/json:
              schema:
                type: object
                required: [success]
                properties:
                  success:
                    type: boolean
                    example: true
        '400':
          description: Body inválido (`VALIDATION_ERROR` o `INVALID_EVENT_DATE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/studio/seo-audit:
    get:
      tags: [studio]
      summary: Auditor de salud SEO/GEO del menú del dueño
      description: |-
        Reporte on-the-fly del panel "Salud SEO" del Studio: `runSeoAudit`
        (api/utils/seoAudit.js, función pura) sobre la carta ya validada. Devuelve
        `{ success, score (0-100), summary {total,ok,warn,fail}, checks[] }` con
        severidad `ok|warn|fail` y hint accionable. Middleware: `authMiddleware`
        (401 sin sesión) → `requireVerifiedEmail` (403 `EMAIL_NOT_CONFIRMED`);
        404 `RESTAURANT_NOT_FOUND` si el usuario no tiene restaurante.
      operationId: studioSeoAudit
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Reporte de salud SEO del menú
          content:
            application/json:
              schema:
                type: object
                required: [success, score, summary, checks]
                properties:
                  success:
                    type: boolean
                    example: true
                  score:
                    type: integer
                    minimum: 0
                    maximum: 100
                    example: 85
                  summary:
                    type: object
                    properties:
                      total:
                        type: integer
                      ok:
                        type: integer
                      warn:
                        type: integer
                      fail:
                        type: integer
                  checks:
                    type: array
                    items:
                      type: object
                      required: [id, label, status, hint]
                      properties:
                        id:
                          type: string
                        label:
                          type: string
                        status:
                          type: string
                          enum: [ok, warn, fail]
                        hint:
                          type: string
        '401':
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Restaurante no encontrado (`RESTAURANT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/studio/staff:
    get:
      tags: [studio]
      summary: Listar el equipo del local (mozos y cocina) y sus mesas
      description: |-
        `authMiddleware` (401) + `requireVerifiedEmail` (403
        `EMAIL_NOT_CONFIRMED`). Devuelve el equipo con `activeSessions` y las
        mesas de cada persona, el mapa completo `assignments`
        (`{"4":"staff_..."}`) y `tables[]` con el nombre resuelto. NUNCA
        incluye `credentialHash` ni el secreto del QR. 404
        `RESTAURANT_NOT_FOUND` si el usuario no tiene local.
      operationId: studioStaffList
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Equipo del local
          content:
            application/json:
              schema:
                type: object
                required: [success, staff, assignments, tables, restaurant]
                properties:
                  success:
                    type: boolean
                    example: true
                  staff:
                    type: array
                    items:
                      $ref: '#/components/schemas/StaffMember'
                  assignments:
                    type: object
                    additionalProperties:
                      type: string
                    example: { '4': staff_abc123_def456 }
                  tables:
                    type: array
                    items:
                      $ref: '#/components/schemas/StaffTableAssignment'
                  restaurant:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      tableCount:
                        type: integer
                        minimum: 1
                        maximum: 200
        '401':
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Email no confirmado (`EMAIL_NOT_CONFIRMED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Restaurante no encontrado (`RESTAURANT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [studio]
      summary: Dar de alta una persona del equipo y emitir su QR de turno
      description: |-
        `authMiddleware` + `requireVerifiedEmail` + `requireActiveSubscription`
        (402 `SUBSCRIPTION_REQUIRED`). El cuerpo NO acepta `id` ni hashes: los
        genera el servidor. La respuesta trae `credential` y `enrollmentUrl`
        UNA SOLA VEZ (el server guarda solo el hash HMAC). El QR apunta a
        `/mozo?r=<restaurantId>&w=<staffId>#k=<secreto>`: el secreto viaja en
        el fragmento y el navegador nunca lo manda al servidor.
      operationId: studioStaffCreate
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 80
                role:
                  type: string
                  enum: [waiter, kitchen]
                  default: waiter
      responses:
        '201':
          description: Integrante creado con su credencial de enrolamiento
          content:
            application/json:
              schema:
                type: object
                required: [success, staff, credential, enrollmentUrl]
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                  staff:
                    $ref: '#/components/schemas/StaffMember'
                  credential:
                    type: string
                    description: Secreto del QR, mostrado una sola vez
                  enrollmentUrl:
                    type: string
                    format: uri
                    description: URL `/mozo?...` con el secreto en el fragmento `#k=`
        '400':
          description: Nombre inválido (`INVALID_STAFF_NAME`) o validación (`VALIDATION_ERROR`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: Suscripción requerida (`SUBSCRIPTION_REQUIRED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Email no confirmado (`EMAIL_NOT_CONFIRMED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Restaurante no encontrado (`RESTAURANT_NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/studio/staff/tables:
    patch:
      tags: [studio]
      summary: Asignar mesas a las personas del equipo
      description: |-
        `authMiddleware` + `requireVerifiedEmail` + `requireActiveSubscription`.
        Reemplaza el mapa completo `restaurant.tableAssignments`
        (`{"4":"staff_..."}`). Rechaza hasta 200 mesas y cualquier id que no
        pertenezca al local. NO toca `restaurant.updatedAt`: asignar mesas no
        es editar la carta ni dispara el 409 de concurrencia del autosave.
        Declarada antes de `/api/studio/staff/{id}` para que `tables` no se
        interprete como un id.
      operationId: studioStaffAssignTables
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [assignments]
              properties:
                assignments:
                  type: object
                  maxProperties: 200
                  additionalProperties:
                    type: string
                  example: { '4': staff_abc123_def456, 'Terraza 1': staff_abc123_def456 }
      responses:
        '200':
          description: Asignaciones guardadas
          content:
            application/json:
              schema:
                type: object
                required: [success, assignments, tables]
                properties:
                  success:
                    type: boolean
                    example: true
                  assignments:
                    type: object
                    additionalProperties:
                      type: string
                  tables:
                    type: array
                    items:
                      $ref: '#/components/schemas/StaffTableAssignment'
        '400':
          description: >-
            Mesa inválida (`INVALID_TABLE_NUMBER`), repetida (`DUPLICATE_TABLE`),
            más de 200 (`TOO_MANY_TABLES`) o persona ajena (`INVALID_STAFF_ID`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Sin sesión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '402':
          description: Suscripción requerida (`SUBSCRIPTION_REQUIRED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Email no confirmado (`EMAIL_NOT_CONFIRMED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
